<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KC Pinball Standings</title>
  <meta name="description" content="Top 100 IFPA pinball players in the Kansas City area">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Doto:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="dmd">
    <h1 class="dmd-title">
      <span>KC-area Pinball Standings</span>
      <span class="dmd-year" id="year"></span>
    </h1>
    <dl class="dmd-stats">
      <div><dt>Tournaments</dt><dd id="tournaments">&nbsp;</dd></div>
      <div><dt>Players</dt><dd id="players">&nbsp;</dd></div>
    </dl>
  </header>

  <main>
    <div class="board" id="board"></div>
    <p class="status" id="status" hidden></p>
  </main>

  <footer>
    <div class="pages" id="pages" aria-hidden="true"></div>
    <p class="meta" id="meta"></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
