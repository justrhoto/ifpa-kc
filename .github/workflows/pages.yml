name: Update KC standings

on:
  schedule:
    # Every 6 hours; IFPA results are usually submitted within a few days.
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore tournament results cache
        uses: actions/cache@v4
        with:
          path: results_cache.json
          key: results-${{ github.run_id }}
          restore-keys: results-

      - name: Build standings
        env:
          IFPA_API_KEY: ${{ secrets.IFPA_API_KEY }}
        run: python kc_tournaments.py --json site/data.json --archive site/data --top 100

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
